# Documentation:
# This workflow performs Continuous Integration for the PotatoNumPy project.
# It triggers on pushes to the main branch and on any pull requests.
# The workflow runs a matrix of jobs across multiple operating systems
# (Ubuntu, Windows, macOS) and Python versions (3.9 to 3.13).
# It installs the package, runs the unittest suite, and checks formatting.
#
# Notes:
# - The FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 environment variable is applied
#   globally to ensure all underlying JavaScript actions execute on Node 24,
#   complying with the GitHub Actions deprecation timeline.
# - Matrix testing is crucial for ensuring the pure Python loops and
#   recursions behave identically across all target environments.
# - macos-latest resolves to an architecture compatible with Node 24 
#   (macOS 14+), satisfying the OS removal constraints.
# - Python 3.13 is set as the primary environment for linting.
#
# TODOS:
# - Monitor actions/checkout and actions/setup-python for major version
#   bumps that natively default to Node 24 and remove the env flag once upgraded.
# - Integrate test coverage reporting (e.g., coverage.py or pytest-cov)
#   and upload results to Codecov or Coveralls.
# - Add a type-checking job using mypy to strictly enforce type hints.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install linting dependencies
        run: python -m pip install --upgrade pip black flake8
      - name: Check formatting with black
        run: black --check src tests examples --target-version py313
      - name: Lint with flake8
        run: flake8 src tests examples --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install project and dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run unittests
        run: python -m unittest discover tests -v