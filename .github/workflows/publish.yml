# Documentation:
# This workflow automates the Continuous Deployment process for PotatoNumPy.
# It triggers exclusively when a new tag matching the 'v*.*.*' pattern
# is pushed to the repository. The workflow builds the source distribution
# and wheel using Python 3.13, then publishes the built artifacts to PyPI 
# using PyPI's Trusted Publisher feature (OIDC authentication).
#
# Notes:
# - The FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 environment variable is applied
#   globally to force the execution of underlying JavaScript actions on Node 24.
# - Trusted Publishing must be configured in the PyPI account settings
#   to link the PyPI project to this specific GitHub repository.
# - The environment is strictly set to 'pypi' to define an isolated
#   deployment target.
#
# TODOS:
# - Monitor pypa/gh-action-pypi-publish for updates regarding native 
#   Node 24 support.
# - Create a GitHub Release automatically using actions/gh-release
#   to attach the build artifacts directly to the repository tags.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1